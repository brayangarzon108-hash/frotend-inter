<div class="card flex justify-center">
  <p-toast />
  <p-dialog
    [header]="'Adicionar materia'"
    [modal]="true"
    [(visible)]="visible2"
    (onHide)="closeDialog()"
    [style]="{ width: '25rem' }"
  >
    <form [formGroup]="upsertCatalog">
      <div class="flex flex-col items-center my-3">
        <div class="flex flex-col w-80">
          <label class="label-filters">Materias*</label>
          <p-select
            [options]="subjectList"
            [filter]="true"
            formControlName="subjectId"
            optionValue="subjectId"
            placeholder="Seleccionar Materia"
            class="w-[209px] md:w-40"
            appendTo="body"
            [style]="{ 'z-index': '1000' }"
          >
            <ng-template let-item pTemplate="item">
              {{ item.nameSubject }} - {{ item.teacher }}
            </ng-template>
            <ng-template let-selectedItem pTemplate="selectedItem">
              {{ selectedItem.nameSubject }} - {{ selectedItem.teacher }}
            </ng-template>
          </p-select>
          @if (
            upsertCatalog.get('subjectId')?.hasError('subjectId') &&
            upsertCatalog.get('subjectId')?.touched &&
            upsertCatalog.get('subjectId')?.value == 0
          ) {
            <span class="text-xs text-red-700 font-semibold">Campo requerido</span>
          } @else {
            <div class="h-[16px] bg-white w-auto"></div>
          }
        </div>
      </div>

      <div class="flex justify-end gap-2" [ngClass]="{ hidden: !visibility() }">
        <p-button
          class="p-confirmdialog-reject-button"
          label="Cancelar"
          severity="secondary"
          (onClick)="closeDialog()"
        />
        <p-button
          class="p-confirmdialog-accept-button"
          [disabled]="upsertCatalog.invalid || handleLoadingUpsert"
          [label]="'Crear'"
          (onClick)="upsertDynamicSubject(upsertCatalog.value)"
        />
      </div>
    </form>
  </p-dialog>
</div>
